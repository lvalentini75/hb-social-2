name: hb_social
description: "HB Social is the ultimate international social network for hunters, designed by hunters, offering a vibrant community, essential tools like hunting calendars and maps, and a dedicated marketplace."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  supabase_flutter: '>=1.10.0'
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  go_router: ^16.2.0
  flutter_riverpod: ^3.0.0
  easy_localization: ^3.0.8
  timeago: ^3.7.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/translations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/dreamflow_icon.jpg
  remove_alpha_ios: true
