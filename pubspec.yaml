name: hb_social
description: "HB Social is the ultimate international social network for hunters, designed by hunters, offering a vibrant community, essential tools like hunting calendars and maps, and a dedicated marketplace."
publish_to: "none"
version: 1.0.1+16

environment:
  sdk: ^3.6.0

dependencies:
  font_awesome_flutter: ^11.0.0
  crypto: ^3.0.0
  sign_in_with_apple: '>=6.1.2'
  flutter_markdown: ^0.7.7+1
  permission_handler: 12.0.1
  livekit_client: ^2.0.0
  video_player_web_hls: ^1.0.0
  sentry_flutter: ^10.0.0
  flutter_svg: ^2.0.0
  flutter_map_marker_cluster: ^8.0.0
  share_plus: ^10.1.4
  printing: ^5.14.2
  pdf: ^3.11.3
  just_audio: ^0.10.6
  record: '>=5.1.2'
  mobile_scanner: ^7.0.0
  latlong2: ^0.9.1
  flutter_map: ^8.0.0
  video_thumbnail: ^0.5.6
  firebase_messaging: ^16.0.0
  shared_preferences: ^2.0.0
  path_provider: ^2.0.0
  web: ^1.0.0
  dio: ^5.0.0
  uuid: ^4.0.0
  geolocator: ^13.0.4
  visibility_detector: ^0.4.0+2
  video_player: '>=2.9.2'
  image_picker: '>=1.1.2'
  image: ^4.0.0
  file_picker: '>=8.1.2'
  qr_flutter: ^4.0.0
  url_launcher: ^6.0.0
  supabase_flutter: '>=1.10.0'
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  go_router: ^16.2.0
  flutter_riverpod: ^3.0.0
  easy_localization: ^3.0.8
  timeago: ^3.7.0
  intl: any
  firebase_core: ^4.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/apple-touch-icon.png
  remove_alpha_ios: true
